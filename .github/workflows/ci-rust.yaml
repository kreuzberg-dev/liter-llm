name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rustfmt.toml
      - .task/**
      - Taskfile.yml
      - .github/workflows/ci-rust.yaml
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - rustfmt.toml
      - .task/**
      - Taskfile.yml
      - .github/workflows/ci-rust.yaml
  workflow_dispatch:

concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    if: github.repository == 'xberg-io/liter-llm' && github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: xberg-io/actions/free-disk-space-linux@v1
        with:
          show-initial: "false"
          show-final: "true"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: rust-${{ matrix.os }}
          use-sccache: "true"
          components: rustfmt, clippy, llvm-tools-preview

      - name: Setup PHP (required by ext-php-rs build script)
        uses: xberg-io/actions/setup-php@v1

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Run Rust tests
        run: task rust:test
        shell: bash

      - name: Run clippy (Linux only)
        if: runner.os == 'Linux'
        run: task rust:lint:check
        shell: bash

      - name: Check Rust formatting (Linux only)
        if: runner.os == 'Linux'
        run: task rust:format:check
        shell: bash

      - name: Install alef (Linux only)
        if: runner.os == 'Linux'
        uses: xberg-io/actions/install-alef@v1

      # ~keep This gate catches generated files drifting from alef.toml. `--exit-code` is no
      # longer required -- it is a hidden, deprecated no-op that alef discards, and verification
      # fails by default -- but it is kept so this step still fails on an older pinned alef.
      - name: Verify binding freshness (Linux only)
        if: runner.os == 'Linux'
        run: alef verify --exit-code
        shell: bash

      # deny.toml already carried an advisories allowlist but nothing in CI ever ran
      # cargo-deny against it, so dependency vulnerabilities went unnoticed. The
      # allowlist documents each tolerated advisory and why it can't be fixed locally;
      # any new advisory fails this step. ~keep
      # ~keep cargo-deny is installed as a native binary rather than run through the
      # upstream cargo-deny Docker action. That action is a Docker container action, and this
      # matrix leg runs on ubuntu-24.04-arm, where the runner could not resolve the image it
      # had just built ("Unable to find image '20b7cf:...' locally" -> "pull access denied
      # for 20b7cf") and the step died before cargo-deny ever executed. The flags below
      # reproduce the action defaults that were in effect (--all-features, log-level warn,
      # manifest-path ./Cargo.toml) so the scan semantics are unchanged.
      - name: Install cargo-deny (Linux only)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency scan (cargo-deny, Linux only)
        if: runner.os == 'Linux'
        run: >-
          cargo deny --all-features --log-level warn --manifest-path ./Cargo.toml
          check advisories bans licenses sources
        shell: bash

      - name: Install cargo-llvm-cov (Linux only)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust coverage (Linux only)
        if: runner.os == 'Linux'
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
        shell: bash

      - name: Upload coverage (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
